<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Studio Rumah 3D: aplikasi web perancang rumah 2D dan 3D untuk belajar mendesain denah, rumah bertingkat, garasi, kolam, kebun, dan kafe halaman.">
<meta name="theme-color" content="#0b6b73">
<title>Studio Rumah 3D</title>
<meta name="author" content="Fadli Abdul Izzati">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Konsep: studio arsitek malam hari. Permukaan kaca buram melayang di atas kanvas, aksen hijau tosca dan kuningan. */
:root{
  --bg:#e7ebee; --panel:#ffffff; --panel2:#f2f5f7; --ink:#101b26; --muted:#5a6876; --line:#d9e0e6;
  --accent:#0b6b73; --accent-ink:#ffffff; --accent-soft:#d6eef0; --brass:#b8924a; --sel:#ff6a1a; --danger:#c8372d;
  --glass:rgba(255,255,255,.80); --glass-line:rgba(16,27,38,.08);
  --paper:#f5f7f9; --grid:#e4e9ed; --grid2:#cfd7de; --wallink:#1a2430; --shadow:0 10px 34px rgba(12,24,36,.14);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --panel:#151b22; --panel2:#1d252e; --ink:#e9eff5; --muted:#92a0ae; --line:#2a333d;
  --accent:#43c6d1; --accent-ink:#031719; --accent-soft:#12373b; --brass:#d3ac62; --sel:#ff8a45; --danger:#ff7a6e;
  --glass:rgba(21,27,34,.78); --glass-line:rgba(255,255,255,.08);
  --paper:#10161c; --grid:#18212a; --grid2:#27323d; --wallink:#e8eff6; --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --panel:#151b22; --panel2:#1d252e; --ink:#e9eff5; --muted:#92a0ae; --line:#2a333d;
  --accent:#43c6d1; --accent-ink:#031719; --accent-soft:#12373b; --brass:#d3ac62; --sel:#ff8a45; --danger:#ff7a6e;
  --glass:rgba(21,27,34,.78); --glass-line:rgba(255,255,255,.08);
  --paper:#10161c; --grid:#18212a; --grid2:#27323d; --wallink:#e8eff6; --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0;width:100%;overflow:hidden;position:fixed;inset:0}
body{background:var(--bg);color:var(--ink);font:14px/1.42 var(--font);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glass-line)}

#app{height:100%;width:100%;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "stage" "panel" "rail";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:none;align-items:center;gap:9px;margin-right:6px;flex:none}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#073f45);display:grid;place-items:center;color:#fff}
.brand .mk svg{width:18px;height:18px}
.brand b{font:500 19px/1 var(--serif);letter-spacing:.01em}
#projName{flex:1 1 90px;min-width:70px;background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 9px;font-weight:600;font-size:15px;-webkit-user-select:text;user-select:text}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--panel2)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--panel2)}
.ib[disabled]{opacity:.32;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:linear-gradient(145deg,var(--accent),#08555c);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(11,107,115,.32)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px}
.onlywide{display:none}

#stage{grid-area:stage;position:relative;display:flex;min-height:0;min-width:0;background:var(--paper)}
.pane{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden}
#stage[data-v="2d"] #pane3d,#stage[data-v="3d"] #pane2d{display:none}
#stage[data-v="split"] #pane2d{border-right:1px solid var(--line)}
#pane3d{background:linear-gradient(180deg,#a9c6de 0%,#d6e3ee 52%,#eef2f5 100%)}
#pane3d.night{background:linear-gradient(180deg,#03060d 0%,#0c1527 55%,#17233a 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#floorBar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#floorBar>*{pointer-events:auto}
.chip{padding:6px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-line);font-weight:600;font-size:12.5px;box-shadow:0 3px 12px rgba(12,24,36,.10);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.t{display:inline-flex;align-items:center;gap:5px}
.chip.t svg.i{width:16px;height:16px}
.fab{position:absolute;display:flex;flex-direction:column;gap:6px}
.fab .ib{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-line);box-shadow:0 3px 12px rgba(12,24,36,.12);border-radius:13px}
#zoomCtl{right:10px;bottom:10px}
#walkPad,#walkFl,#walkTip{display:none;position:absolute;z-index:5}
#pane3d.walking #walkPad{display:grid;grid-template-areas:". u ." "l . r" ". d .";gap:6px;left:12px;bottom:12px}
#pane3d.walking #walkFl{display:flex;flex-direction:column;gap:6px;right:12px;bottom:12px}
#pane3d.walking #walkTip{display:block;left:50%;bottom:14px;transform:translateX(-50%);max-width:34%;text-align:center;line-height:1.35;padding:7px 12px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12px;color:var(--muted);pointer-events:none}
#pane3d.walking #zoom3{display:none}
#walkPad button,#walkFl button{min-width:50px;height:46px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:700;font-size:15px;color:var(--ink);box-shadow:0 3px 12px rgba(12,24,36,.14);touch-action:none;user-select:none;-webkit-user-select:none}
#walkFl button{font-size:12.5px;padding:0 12px}
#walkPad button.on{background:var(--ink);color:var(--panel)}
@media(max-width:560px){#pane3d.walking #walkTip{display:none}}
#zoom3{right:10px;bottom:10px}
#hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 70px);padding:8px 12px;border-radius:12px;font-size:12.5px;color:var(--muted);box-shadow:0 3px 12px rgba(12,24,36,.10);pointer-events:none}
#hint b{color:var(--ink);font-weight:600}
#bar3d{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
#walkPad{position:absolute;left:12px;bottom:12px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;touch-action:none}
#walkPad.on{display:grid}
#walkPad button{border-radius:14px;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-line);box-shadow:0 3px 12px rgba(12,24,36,.14);touch-action:none}
#walkPad button:active{background:var(--accent);color:#fff}
#walkTip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;padding:7px 12px;border-radius:12px;font-size:12px;color:var(--muted);display:none;pointer-events:none;white-space:nowrap}
#nogl{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted)}

#rail{grid-area:rail;display:flex;margin:0 8px calc(6px + env(safe-area-inset-bottom,0px));padding:4px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.tb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:15px;color:var(--muted);font-size:10.5px;font-weight:600}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tb svg.i{width:22px;height:22px}

#panel{grid-area:panel;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;margin:0 4px;max-height:42vh;display:flex;flex-direction:column;min-height:0;box-shadow:0 -8px 28px rgba(12,24,36,.10)}
#panelHandle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 4px;cursor:pointer;flex:none;position:relative}
#panelHandle::before{content:"";position:absolute;left:50%;top:5px;width:38px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
#panelTitle{font:500 17px/1.2 var(--serif);margin-top:6px}
#panelToggle svg{transition:transform .2s}
#panel.col #panelToggle svg{transform:rotate(180deg)}
#panel.col #panelBody{display:none}
#panelBody{overflow:auto;padding:2px 16px 16px;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.sec{margin:12px 0 0}
.sec>h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row.scroll::-webkit-scrollbar{display:none}
.row.scroll>*{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px}
.card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px;border:1.5px solid transparent;border-radius:14px;background:var(--panel2);font-size:11.5px;text-align:center;line-height:1.2;min-width:0;transition:transform .12s}
.card:active{transform:scale(.97)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.card img,.card .sw{width:50px;height:50px;border-radius:11px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.card .sw{background-size:cover}
.card small{color:var(--muted);font-family:var(--mono);font-size:10px}
.card svg.i{width:46px;height:32px;stroke-width:1.4;color:var(--ink)}
.pill{padding:6px 12px;border-radius:999px;border:1.5px solid transparent;font-size:12.5px;font-weight:500;background:var(--panel2)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:70px;flex:1}
.fld input[type=number],.fld input[type=text],.fld select{width:100%;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:13px;-webkit-user-select:text;user-select:text}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.swc{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--brass));width:0;transition:width .3s}
.les{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.les .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--muted)}
.les.ok .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.les b{font-weight:600}
.les p{margin:2px 0 6px;color:var(--muted);font-size:12.5px}
.fl{display:flex;align-items:center;gap:6px;padding:4px 0}
.fl input{flex:1;min-width:0;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);-webkit-user-select:text;user-select:text}
.credit{margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.credit b{color:var(--ink);font:500 14px var(--serif)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(6,12,18,.58);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px 14px;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:20px;width:min(540px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font:500 18px var(--serif)}
.sheet>.bd{padding:14px 16px;overflow:auto;-webkit-user-select:text;user-select:text}
.sheet img.photo{width:100%;border-radius:12px;border:1px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto}
.proj{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.proj .nm{flex:1;min-width:0}.proj .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj small{color:var(--muted)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tpl button{text-align:left;padding:11px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.tpl button b{display:block;color:var(--ink);font:500 15px var(--serif);margin-bottom:2px}
.tpl button:hover{border-color:var(--accent)}
textarea{width:100%;min-height:90px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:11px}

@media (max-width:560px){
  #top{gap:2px;padding:6px 6px}
  #top .ib{width:34px;height:34px}
  #projName{min-width:0;flex:1 1 0;font-size:14px;padding:6px 4px}
  .seg button{padding:6px 10px}
  #btnSave{padding:8px 10px}
  #btnSave .lbl{display:none}
  #hint{font-size:11.5px;padding:6px 9px;max-width:calc(100% - 66px)}
  .chip{padding:5px 10px;font-size:12px}
  #bar3d{gap:5px}
  #walkTip{display:none!important}
}
@media (min-width:700px){.brand{display:flex}}
@media (min-width:900px){
  #app{grid-template-columns:78px minmax(0,1fr) 352px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "rail stage panel";background:var(--bg)}
  #stage{margin:10px 0;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  #rail{flex-direction:column;margin:10px 0 10px 10px;padding:8px 6px;gap:3px;justify-content:flex-start;overflow:auto;align-self:start}
  .tb{flex:none;padding:10px 0 8px}
  #panel{margin:10px 10px 10px 10px;border-radius:20px;border-bottom:1px solid var(--line);max-height:none;box-shadow:var(--shadow)}
  #panel.col #panelBody{display:block}
  #panelToggle{display:none}
  #panelHandle{cursor:default}
  #panelHandle::before{display:none}
  #panelTitle{margin-top:2px;font-size:19px}
  .onlywide{display:inline-block}
  #toast{bottom:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
}
@media (max-height:520px) and (orientation:landscape){#panel{max-height:55vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <button class="ib" id="btnMenu" aria-label="Proyek tersimpan"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="brand"><span class="mk"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 9.5V20h14V9.5M10 20v-6h4v6"/></svg></span><b>Studio Rumah</b></div>
    <input id="projName" type="text" aria-label="Nama proyek" maxlength="40" autocomplete="off">
    <div class="seg" id="viewSeg" role="group" aria-label="Tampilan">
      <button data-v="2d" aria-pressed="true">2D</button>
      <button data-v="split" class="onlywide" aria-pressed="false">2D+3D</button>
      <button data-v="3d" aria-pressed="false">3D</button>
    </div>
    <button class="ib" id="btnUndo" aria-label="Urungkan"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="btnRedo" aria-label="Ulangi"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn pri" id="btnSave"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/></svg><span class="lbl">Simpan</span></button>
  </header>

  <main id="stage" data-v="2d">
    <section class="pane" id="pane2d">
      <canvas id="c2d"></canvas>
      <div id="floorBar"></div>
      <div id="hint" class="glass"></div>
      <div id="zoomCtl" class="fab">
        <button class="ib" id="zIn" aria-label="Perbesar"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" id="zOut" aria-label="Perkecil"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="ib" id="zFit" aria-label="Pas ke layar"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </section>
    <section class="pane" id="pane3d">
      <canvas id="c3d"></canvas>
      <div id="bar3d">
        <button class="chip t" id="t3Roof" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M6 10v9h12v-9"/></svg>Atap</button>
        <button class="chip t" id="t3Night" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>Malam</button>
        <button class="chip t" id="t3Cut" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg>Potong lantai</button>
        <button class="chip t" id="v3Far" aria-pressed="false">Jauh</button>
        <button class="chip t" id="v3Iso" aria-pressed="false">Isometrik</button>
        <button class="chip t" id="v3Front" aria-pressed="false">Depan</button>
        <button class="chip t" id="v3Top" aria-pressed="false">Atas</button>
        <button class="chip t" id="v3Near" aria-pressed="false">Dekat</button>

/* ---------- tekstur prosedural ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(h,k){const[r,g,b]=hexRGB(h);const f=v=>clamp(Math.round(v*k),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function tint(h,k){const[r,g,b]=hexRGB(h);const f=v=>clamp(Math.round(v*k),0,255).toString(16).padStart(2,'0');return'#'+f(r)+f(g)+f(b)}
const SZ=256;
const PAINT={
  plaster(g,c,R){g.fillStyle=c;g.fillRect(0,0,SZ,SZ);for(let i=0;i<1100;i++){g.fillStyle=R()<.5?'rgba(0,0,0,.045)':'rgba(255,255,255,.07)';g.fillRect(R()*SZ,R()*SZ,1+R()*2,1+R()*2)}},
  brick(g,c,R,dark){const cols=dark?6:4,rows=12,bw=SZ/cols,bh=SZ/rows;g.fillStyle=dark?'#1d2026':'#d2cabb';g.fillRect(0,0,SZ,SZ);
    for(let r=0;r<rows;r++){const off=r%2?bw/2:0;for(let k=-1;k<=cols;k++){g.fillStyle=shade(c,(dark?.78:.82)+R()*.34);g.fillRect(k*bw+off+1.4,r*bh+1.4,bw-2.8,bh-2.8)}}
    for(let i=0;i<500;i++){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(R()*SZ,R()*SZ,2,1)}},
  brickd(g,c,R){PAINT.brick(g,c,R,true)},
  flag(g,c,R){const n=26,sx=[],sy=[],col=[];for(let i=0;i<n;i++){sx.push(R()*SZ);sy.push(R()*SZ);col.push(hexRGB(c).map(v=>clamp(v*(.82+R()*.34),0,255)))}
    const im=g.createImageData(SZ,SZ);const d=im.data;
    for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){let b1=1e9,b2=1e9,bi=0;
      for(let i=0;i<n;i++)for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const dx=x-(sx[i]+ox*SZ),dy=y-(sy[i]+oy*SZ);const dd=dx*dx+dy*dy;if(dd<b1){b2=b1;b1=dd;bi=i}else if(dd<b2)b2=dd}
      const edge=Math.sqrt(b2)-Math.sqrt(b1);const p=(y*SZ+x)*4;const k=edge<3.2?.45:1;
      d[p]=col[bi][0]*k;d[p+1]=col[bi][1]*k;d[p+2]=col[bi][2]*k;d[p+3]=255}
    g.putImageData(im,0,0)},
  woodv(g,c,R){const n=8,w=SZ/n;for(let i=0;i<n;i++){g.fillStyle=shade(c,.84+R()*.3);g.fillRect(i*w,0,w,SZ);for(let j=0;j<10;j++){g.fillStyle='rgba(0,0,0,.09)';g.fillRect(i*w+R()*w,0,1,SZ)}g.fillStyle='rgba(0,0,0,.35)';g.fillRect(i*w,0,1.5,SZ)}},
  wood(g,c,R){const rows=6,bh=SZ/rows;for(let r=0;r<rows;r++){let x=-R()*100;while(x<SZ){const len=110+R()*90;g.fillStyle=shade(c,.84+R()*.3);g.fillRect(x,r*bh,len,bh);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x,r*bh,1.5,bh);for(let j=0;j<5;j++){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x,r*bh+R()*bh,len,1)}x+=len}g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,r*bh,SZ,1.5)}},
  tile(g,c,R){g.fillStyle='#bfc3c8';g.fillRect(0,0,SZ,SZ);const h=SZ/2;for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=shade(c,.97+R()*.06);g.fillRect(i*h+2,j*h+2,h-4,h-4)}
    for(let i=0;i<260;i++){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(R()*SZ,R()*SZ,2,2)}},
  paving(g,c,R){g.fillStyle='#8f918e';g.fillRect(0,0,SZ,SZ);const h=SZ/3;for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.fillStyle=shade(c,.9+R()*.18);g.fillRect(i*h+2,j*h+2,h-4,h-4)}},
  grass(g,c,R){g.fillStyle=c;g.fillRect(0,0,SZ,SZ);g.lineWidth=1.3;for(let i=0;i<4200;i++){const x=R()*SZ,y=R()*SZ,a=(R()-.5)*1.1,l=4+R()*8;g.strokeStyle=shade(c,.62+R()*.7);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(a)*l,y-Math.cos(a)*l);g.stroke()}},
  gravel(g,c,R){g.fillStyle=c;g.fillRect(0,0,SZ,SZ);for(let i=0;i<2600;i++){g.fillStyle=shade(c,.65+R()*.7);g.beginPath();g.ellipse(R()*SZ,R()*SZ,1+R()*2.4,1+R()*1.6,R()*3,0,7);g.fill()}},
  concrete(g,c,R){g.fillStyle=c;g.fillRect(0,0,SZ,SZ);for(let i=0;i<30;i++){g.fillStyle=R()<.5?'rgba(0,0,0,.035)':'rgba(255,255,255,.05)';g.beginPath();g.arc(R()*SZ,R()*SZ,20+R()*50,0,7);g.fill()}for(let i=0;i<900;i++){g.fillStyle='rgba(0,0,0,.07)';g.fillRect(R()*SZ,R()*SZ,1.5,1.5)}},
  water(g,c,R){g.fillStyle=c;g.fillRect(0,0,SZ,SZ);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=2;for(let i=0;i<14;i++){const y=R()*SZ,x=R()*SZ;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+20,y-8,x+40,y+8,x+60,y);g.stroke()}}
};
const _tex={};
function texOf(def,key){
  const k=key;if(_tex[k])return _tex[k];
  const cv=document.createElement('canvas');cv.width=cv.height=SZ;const g=cv.getContext('2d');
  let seed=0;for(const ch of k)seed=(seed*31+ch.charCodeAt(0))>>>0;
  PAINT[def.t](g,def.c,rng(seed));
  return _tex[k]={cv,def};
}
function swatchURL(def,key){
  const t=texOf(def,key);const c=document.createElement('canvas');c.width=c.height=64;c.getContext('2d').drawImage(t.cv,0,0,64,64);return c.toDataURL();
}

/* ---------- model proyek ---------- */
let P=newProject('Rumah baru');
function newProject(name){return{v:1,name:name||'Rumah baru',lot:{w:9,d:16,ground:'rumput'},floors:[{name:'Lantai 1'}],walls:[],zones:[],ops:[],objs:[],nid:1,saved:0}}
const uid=()=>P.nid++;
const floorY=f=>f*FH;
const wlen=w=>Math.hypot(w.x2-w.x1,w.y2-w.y1);
function addWall(f,x1,y1,x2,y2,o){o=o||{};const w={id:uid(),f,x1:r2(x1),y1:r2(y1),x2:r2(x2),y2:r2(y2),t:o.t||0.15,h:o.h||WALLH,mat:o.mat||'krem',style:o.style||'tembok'};P.walls.push(w);return w}
function addZone(f,type,x,y,w,d,o){o=o||{};const T=ZTYPES[type];const z={id:uid(),f,type,name:o.name||T.n,x:r2(x),y:r2(y),w:r2(w),d:r2(d),mat:o.mat||T.mat,roof:o.roof==null?T.roof:o.roof};P.zones.push(z);return z}
function addOp(wall,s,type,o){o=o||{};const T=OPTYPES[type];const op={id:uid(),wid:wall.id,s:r2(s),type,w:o.w||T.w,flip:o.flip?1:0};P.ops.push(op);return op}
function addObj(f,type,x,y,o){o=o||{};const D=OBJ[type];const ob={id:uid(),f,type,x:r2(x),y:r2(y),rot:o.rot==null?D.rot:o.rot,c:o.c||D.c,lift:o.lift==null?D.lift:o.lift};P.objs.push(ob);return ob}
function wallById(id){return P.walls.find(w=>w.id===id)}
function delItem(kind,id){
  if(kind==='wall'){P.walls=P.walls.filter(w=>w.id!==id);P.ops=P.ops.filter(o=>o.wid!==id)}
  else if(kind==='zone')P.zones=P.zones.filter(z=>z.id!==id);
  else if(kind==='obj')P.objs=P.objs.filter(o=>o.id!==id);
  else if(kind==='op')P.ops=P.ops.filter(o=>o.id!==id);
}
function findItem(kind,id){return(kind==='wall'?P.walls:kind==='zone'?P.zones:kind==='obj'?P.objs:P.ops).find(i=>i.id===id)}
function surfaceY(f,x,y){
  if(f>0)return floorY(f);
  let t=0;for(const z of P.zones){if(z.f!==0)continue;if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.d)t=Math.max(t,ZTYPES[z.type].top)}
  return t;
}
function zoneTop(z){return z.f>0?floorY(z.f):ZTYPES[z.type].top}
function zoneCovered(z,visFloors){
  const a=z.w*z.d;let cov=0;
  for(const u of P.zones){if(u.f<=z.f||!visFloors.includes(u.f))continue;const ox=Math.max(0,Math.min(z.x+z.w,u.x+u.w)-Math.max(z.x,u.x)),oy=Math.max(0,Math.min(z.y+z.d,u.y+u.d)-Math.max(z.y,u.y));cov+=ox*oy}
  return cov>0.3*a;
}

const hist={u:[],r:[]};
function pushUndo(){hist.u.push(JSON.stringify(P));if(hist.u.length>80)hist.u.shift();hist.r.length=0;updHist()}
function undo(){if(!hist.u.length)return;hist.r.push(JSON.stringify(P));P=JSON.parse(hist.u.pop());afterRestore()}
function redo(){if(!hist.r.length)return;hist.u.push(JSON.stringify(P));P=JSON.parse(hist.r.pop());afterRestore()}
function updHist(){const u=$('#btnUndo'),r=$('#btnRedo');if(u)u.disabled=!hist.u.length;if(r)r.disabled=!hist.r.length}

const KEY_AUTO='studiorumah.auto',KEY_IDX='studiorumah.idx';
let memAuto=null;
function idx(){try{return JSON.parse(LS.get(KEY_IDX)||'[]')}catch(e){return[]}}
function saveIdx(a){LS.set(KEY_IDX,JSON.stringify(a))}
let autoT=null;
function scheduleAuto(){clearTimeout(autoT);autoT=setTimeout(()=>{const s=JSON.stringify(P);memAuto=s;LS.set(KEY_AUTO,s)},700)}
function saveProject(){
  if(!P.pid)P.pid='p'+Date.now().toString(36);
  P.saved=1;const s=JSON.stringify(P);
  const ok=LS.set('studiorumah.p.'+P.pid,s);
  if(ok){const a=idx().filter(i=>i.id!==P.pid);a.unshift({id:P.pid,name:P.name,t:Date.now(),floors:P.floors.length});saveIdx(a)}
  memAuto=s;LS.set(KEY_AUTO,s);
  return ok;
}
function loadProjectById(id){const s=LS.get('studiorumah.p.'+id);if(!s)return false;try{P=JSON.parse(s);return true}catch(e){return false}}
function deleteProjectById(id){LS.del('studiorumah.p.'+id);saveIdx(idx().filter(i=>i.id!==id))}

/* ----- mode jalan-jalan ----- */
const W={on:false,x:0,z:0,yaw:0,pit:0,k:{f:0,b:0,l:0,r:0,tl:0,tr:0},t:0};
function walkEye(){return surfaceY(activeFloor,W.x,W.z)+1.6}
function walkBlocked(x,z){
  const f=activeFloor;
  if(x<-3||z<-3||x>P.lot.w+3||z>P.lot.d+3)return true;
  for(const w of P.walls){
    if(w.f!==f)continue;
    const dx=w.x2-w.x1,dz=w.y2-w.y1,L=Math.hypot(dx,dz);if(L<0.01)continue;
    const ux=dx/L,uz=dz/L;let s=(x-w.x1)*ux+(z-w.y1)*uz;const sc=Math.max(0,Math.min(L,s));
    const d=Math.hypot(x-(w.x1+ux*sc),z-(w.y1+uz*sc));
    if(d>(w.t||0.2)/2+0.22)continue;
    let free=false;
    for(const o of P.ops){if(o.wid!==w.id||o.type.indexOf('jendela')===0)continue;if(Math.abs(s-o.s)<o.w/2-0.12){free=true;break}}
    if(!free)return true;
  }
  return false;
}
function walkMove(fw,st){
  const sy=Math.sin(W.yaw),cy=Math.cos(W.yaw);
  const dx=sy*fw+cy*st,dz=-cy*fw+sy*st;
  if(!walkBlocked(W.x+dx,W.z))W.x+=dx;
  if(!walkBlocked(W.x,W.z+dz))W.z+=dz;
  need3D=true;
}
function stepWalk(){
  if(!W.on)return;const now=performance.now(),dt=Math.min(0.06,(now-(W.t||now))/1000);W.t=now;
  const fw=W.k.f-W.k.b,st=W.k.r-W.k.l,tn=W.k.tr-W.k.tl;
  if(tn){W.yaw+=tn*1.7*dt;need3D=true}
  if(fw||st){const n=Math.hypot(fw,st),v=(W.k.fast?4.6:2.4)*dt/n;walkMove(fw*v,st*v)}
}
function walkSpot(){
  const hb=houseBox(),c=activeFloor>0?[[hb.cx,hb.cz]]:[[P.lot.w/2,P.lot.d-1.2],[hb.cx,P.lot.d-1.2],[P.lot.w/2,hb.cz]];
  for(const [cx,cz] of c)for(let r=0;r<6;r+=0.5)for(let a=0;a<12;a++){
    const x=cx+Math.cos(a*0.5236)*r,z=cz+Math.sin(a*0.5236)*r;if(!walkBlocked(x,z))return[x,z];
  }
  return[P.lot.w/2,P.lot.d-1.2];
}
function walkStart(){
  const [x,z]=walkSpot();W.x=x;W.z=z;W.yaw=0;W.pit=-0.04;W.on=true;W.t=performance.now();camGoal=null;
  camera.fov=66;camera.updateProjectionMatrix();
  $('#pane3d').classList.add('walking');$('#v3Eye').setAttribute('aria-pressed','true');need3D=true;
}
function walkStop(){
  if(!W.on)return;W.on=false;Object.keys(W.k).forEach(k=>W.k[k]=0);
  camera.fov=40;camera.updateProjectionMatrix();
  $('#pane3d').classList.remove('walking');$('#v3Eye').setAttribute('aria-pressed','false');need3D=true;
}
function walkFloor(d){
  const n=clamp(activeFloor+d,0,P.floors.length-1);if(n===activeFloor)return;
  activeFloor=n;sel=null;renderFloorBar();renderPanel();inv2();dirty3D=true;
  if(walkBlocked(W.x,W.z)){const [x,z]=walkSpot();W.x=x;W.z=z}
  need3D=true;
}
function bindWalk(){
  const map={w:'f',arrowup:'f',s:'b',arrowdown:'b',a:'l',d:'r',arrowleft:'tl',arrowright:'tr'};
  const key=(e,v)=>{
    if(!W.on)return;const t=(e.target.tagName||'').toLowerCase();if(t==='input'||t==='textarea')return;
    const k=map[e.key.toLowerCase()];if(k){W.k[k]=v;e.preventDefault()}
    if(e.key==='Shift')W.k.fast=v;
  };
  window.addEventListener('keydown',e=>key(e,1));window.addEventListener('keyup',e=>key(e,0));
  window.addEventListener('blur',()=>Object.keys(W.k).forEach(k=>W.k[k]=0));
  document.querySelectorAll('#walkPad [data-w]').forEach(b=>{
    const k=b.dataset.w,on=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);W.k[k]=1;b.classList.add('on')},off=()=>{W.k[k]=0;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  });

}
let camGoal=null;
function stepCam(){
  if(!camGoal)return;let done=true;
  for(const k of['tx','ty','tz','th','ph','r']){const d=camGoal[k]-cam[k];if(Math.abs(d)>0.002){cam[k]+=d*0.2;done=false}else cam[k]=camGoal[k]}
  if(done)camGoal=null;need3D=true;
}
function houseBox(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(a,b)=>{x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b)};
  P.walls.forEach(w=>{if(w.style==='tembok'){add(w.x1,w.y1);add(w.x2,w.y2)}});P.zones.forEach(z=>{if(z.type==='ruang'||z.type==='garasi'){add(z.x,z.y);add(z.x+z.w,z.y+z.d)}});
  if(x0>x1)return{cx:P.lot.w/2,cz:P.lot.d/2,s:Math.max(P.lot.w,P.lot.d)*0.5};
  return{cx:(x0+x1)/2,cz:(y0+y1)/2,s:Math.max(x1-x0,y1-y0)};
}
function camPreset(n,instant){

  else if(n==='near')g={tx:hb.cx,ty:1.6,tz:hb.cz,th:0.5,ph:1.12,r:Math.max(5,hb.s*0.95)};
  else if(n==='far')g=Object.assign({},lc,{th:0.55,ph:0.8,r:m*3.4+30});
  else if(n==='eye')g={tx:hb.cx,ty:1.6,tz:hb.cz,th:0.3,ph:1.53,r:Math.max(7,hb.s*0.85)};

function zoom3(f){camGoal=Object.assign({},camGoal||cam,{r:clamp((camGoal||cam).r*f,0.9,260)});need3D=true}
function visFloors(){const mx=V3.cut?Math.min(activeFloor,P.floors.length-1):P.floors.length-1;const a=[];for(let i=0;i<=mx;i++)a.push(i);return a}

/* ----- bukaan (pintu, jendela) ----- */
function addOpening3D(g,o,T,cx,y0,t){
  const w=o.w,h=T.h,type=o.type,fr=0.05,dp=t+0.05,FR='#1b1e23';
  const isWin=type.indexOf('jendela')===0;
  if(type==='lubang')return;
  bx(g,fr,h,dp,cx-w/2+fr/2,y0,0,FR);bx(g,fr,h,dp,cx+w/2-fr/2,y0,0,FR);bx(g,w,fr,dp,cx,y0+h-fr,0,FR);
  if(isWin)bx(g,w,fr,dp,cx,y0,0,FR);
  const gm=(gw,gh,gx,gy)=>{const m=new THREE.Mesh(BG(gw,gh,0.02),GLASS());m.position.set(gx,gy+gh/2,0);m.userData.glass=1;g.add(m)};
  if(isWin){
    if(type==='jendela_jalusi'){for(let y=y0+fr+0.04;y<y0+h-fr-0.06;y+=0.11){const s=bx(g,w-2*fr,0.014,0.13,cx,y,0,'#2a2d33');s.rotation.x=0.65}return}
    gm(w-2*fr,h-2*fr,cx,y0+fr);
    if(type==='jendela'){bx(g,0.035,h-2*fr,0.07,cx,y0+fr,0,FR);bx(g,w-2*fr,0.035,0.07,cx,y0+h*0.58,0,FR)}
    else if(type==='jendela_lebar'){for(const k of[-1,1])bx(g,0.035,h-2*fr,0.07,cx+k*w/6,y0+fr,0,FR);bx(g,w-2*fr,0.035,0.07,cx,y0+h*0.66,0,FR)}
    else {for(const k of[0.33,0.66])bx(g,w-2*fr,0.035,0.07,cx,y0+h*k,0,FR)}
  }else if(type==='pintu'){
    bx(g,w-2*fr,h-fr,0.05,cx,y0,0,'#4b3327');
    bx(g,w*0.62,h*0.38,0.012,cx,y0+h*0.54,0.03,'#5a3f31');bx(g,w*0.62,h*0.3,0.012,cx,y0+h*0.12,0.03,'#5a3f31');
    sph(g,0.035,cx+w/2-0.14,y0+1.0,0.05,'#c9ced3');
  }else if(type==='pintu_perancis'){
    gm(w-2*fr,h-2*fr,cx,y0);bx(g,0.05,h-fr,0.07,cx,y0,0,FR);
    for(const k of[-1,1]){for(let j=1;j<4;j++)bx(g,w/2-0.1,0.03,0.06,cx+k*w/4,y0+j*h/4,0,FR);bx(g,0.03,h-fr,0.06,cx+k*w/4,y0,0,FR);bx(g,0.03,0.2,0.04,cx+k*0.09,y0+1.0,0.05,'#c9ced3')}
  }else if(type==='pintu_geser'){
    for(const k of[-1,1]){const px=cx+k*w/4,pw=w/2-0.04,zz=k*0.035;
      const m=new THREE.Mesh(BG(pw-0.1,h-0.14,0.02),GLASS());m.position.set(px,y0+h/2,zz);m.userData.glass=1;g.add(m);
      bx(g,0.05,h-0.06,0.05,px-pw/2,y0,zz,FR);bx(g,0.05,h-0.06,0.05,px+pw/2,y0,zz,FR);bx(g,pw,0.05,0.05,px,y0+h-0.1,zz,FR);bx(g,pw,0.05,0.05,px,y0+0.02,zz,FR)}
  }else if(type==='pintu_pivot'){
    bx(g,w-2*fr,h-fr,0.07,cx,y0,0,'#7a5238');for(let k=1;k<6;k++)bx(g,0.012,h-fr-0.1,0.075,cx-w/2+k*(w/6),y0+0.05,0,'#5a3b27');
    bx(g,0.035,1.2,0.05,cx+w*0.32,y0+0.5,0.06,'#c9ced3');bx(g,w-0.2,0.03,0.075,cx,y0+h-0.25,0,'#2a2d33');
  }else if(type==='garasi'){
    bx(g,w-2*fr,h-fr,0.07,cx,y0,0,'#5d636d');for(let k=1;k<9;k++)bx(g,w-2*fr,0.012,0.075,cx,y0+k*0.25,0,'#2a2d33');
    for(let i=0;i<4;i++){const gl=new THREE.Mesh(BG((w-0.5)/4-0.1,0.18,0.02),GLASS());gl.position.set(cx+(i-1.5)*((w-0.5)/4),y0+h-0.45,0.045);gl.userData.glass=1;g.add(gl)}
    bx(g,w-2*fr,0.06,0.09,cx,y0+h-fr-0.06,0,'#2a2d33');glow(g,0.5,0.02,0.04,cx,y0+h-0.02,0.07);
  }else if(type==='pintu_kaca'){
    gm(w-2*fr,h-2*fr,cx,y0);
    bx(g,0.05,h-fr,0.07,cx,y0,0,FR);for(const k of[-1,1])bx(g,0.035,h-fr,0.07,cx+k*w/4,y0,0,FR);bx(g,w-2*fr,0.035,0.07,cx,y0+1.0,0,FR);
    bx(g,0.025,0.5,0.03,cx-0.1,y0+0.9,0.045,'#c9ced3');bx(g,0.025,0.5,0.03,cx+0.1,y0+0.9,0.045,'#c9ced3');
  }
}

function buildWall(w){
  const L=wlen(w),t=w.t,H=w.h,f=w.f,pl=f===0?PLINTH:0,ext=t/2;
  const g=new THREE.Group();g.position.set((w.x1+w.x2)/2,floorY(f),(w.y1+w.y2)/2);g.rotation.y=-Math.atan2(w.y2-w.y1,w.x2-w.x1);
  g.userData.pick={kind:'wall',id:w.id};
  const ops=P.ops.filter(o=>o.wid===w.id).sort((a,b)=>a.s-b.s);
  const def=WALLMATS[w.mat]||WALLMATS.krem;const sm=surfMat('w',w.mat),top=TOPM();
  const mats=[sm,sm,top,sm,sm,sm];
  const piece=(x0,x1,y0,y1,hh)=>{if(x1-x0<0.004||y1-y0<0.004)return;const ww=x1-x0,h=y1-y0;const geo=uBox(ww,h,t,def.tw,def.th);const m=new THREE.Mesh(geo,mats);m.position.set((x0+x1)/2,(y0+y1)/2,0);g.add(m)};
  if(w.style==='tembok'){
    let cur=-L/2-ext;
    for(const o of ops){const T=OPTYPES[o.type];if(!T||o.type==='gerbang')continue;
      let a=o.s-o.w/2-L/2,b=o.s+o.w/2-L/2;a=Math.max(a,cur,-L/2);b=Math.min(b,L/2);if(b<=a)continue;
      piece(cur,a,0,H);const bot=pl+T.sill;if(bot>0.004)piece(a,b,0,bot);if(bot+T.h<H-0.004)piece(a,b,bot+T.h,H);
      addOpening3D(g,{w:b-a,type:o.type},T,(a+b)/2,bot,t);cur=Math.max(cur,b);}

function mutSel(fn){const it=findItem(sel.kind,sel.id);if(!it)return;pushUndo();fn(it);changed()}
function actions(a,d){
  switch(a){
    case'setopt':{const k=d.k,v=d.v;opts[k]=v;
      if(k==='areaType'){opts.areaMat=ZTYPES[v].mat;opts.areaRoof=ZTYPES[v].roof}
      if(k==='wallStyle'){const F=FENCES[v];opts.wallH=v==='tembok'?3.0:F?F.h:1.0;opts.wallMat=v==='tembok'?'krem':F?F.mat:'hitam'}
      if(k==='objType'){opts.objType=v;const D=OBJ[v];if(window.innerWidth<900)toast('Ketuk denah untuk menaruh '+D.name+'.')}
      if(k==='opType'&&window.innerWidth<900)toast('Ketuk dinding untuk memasang.');
      renderPanel();break}
    case'objcat':opts.objCat=d.v;opts.objType=Object.values(OBJ).find(o=>o.cat===d.v).id;renderPanel();break;
    case'lesson':setTool(d.v);break;
    case'addfloor':pushUndo();P.floors.push({name:'Lantai '+(P.floors.length+1)});activeFloor=P.floors.length-1;changed();toast('Lantai baru ditambahkan.');break;
    case'copyfloor':{pushUndo();const src=activeFloor,nf=P.floors.length;P.floors.push({name:'Lantai '+(nf+1)});const map={};
      P.walls.filter(w=>w.f===src).slice().forEach(w=>{const n=Object.assign({},w,{id:uid(),f:nf});map[w.id]=n.id;P.walls.push(n)});
      P.ops.filter(o=>map[o.wid]).slice().forEach(o=>P.ops.push(Object.assign({},o,{id:uid(),wid:map[o.wid]})));
      P.zones.filter(z=>z.f===src).slice().forEach(z=>P.zones.push(Object.assign({},z,{id:uid(),f:nf})));
      P.objs.filter(o=>o.f===src&&o.type!=='kolom').slice().forEach(o=>P.objs.push(Object.assign({},o,{id:uid(),f:nf})));
      activeFloor=nf;sel=null;changed();toast('Lantai disalin ke atas.');break}
    case'delfloor':{const i=+d.v;pushUndo();const ws=P.walls.filter(w=>w.f===i).map(w=>w.id);
      P.walls=P.walls.filter(w=>w.f!==i);P.ops=P.ops.filter(o=>!ws.includes(o.wid));P.zones=P.zones.filter(z=>z.f!==i);P.objs=P.objs.filter(o=>o.f!==i);
      [P.walls,P.zones,P.objs].forEach(a=>a.forEach(x=>{if(x.f>i)x.f--}));P.floors.splice(i,1);activeFloor=Math.min(activeFloor,P.floors.length-1);sel=null;changed();break}
    case'ground':pushUndo();P.lot.ground=d.v;changed();break;
    case'setfence':opts.fenceStyle=d.v;renderPanel();break;
    case'fence':{pushUndo();const W=P.lot.w,D=P.lot.d,fs=opts.fenceStyle||'pagar',F=FENCES[fs],o={style:fs,h:F.h,mat:F.mat,t:F.t};
      addWall(0,0,0,W,0,o);addWall(0,W,0,W,D,o);addWall(0,0,0,0,D,o);const fr=addWall(0,0,D,W,D,o);addOp(fr,Math.min(W/2,3),'gerbang');changed();toast('Pagar keliling dipasang.');break}
    case'template':pushUndo();if(TPLX[d.v])TPLX[d.v].fn();else if(d.v==='villa')loadVilla();else loadTemplate();activeFloor=0;afterRestore();camPreset('iso');fit2D();toast('Contoh dimuat. Coba putar dan dekatkan kamera di 3D.');break;
    case'clear':pushUndo();{const lot=P.lot,name=P.name;P=newProject(name);P.lot=lot}activeFloor=0;afterRestore();toast('Kanvas dikosongkan.');break;
    case'del':if(sel){pushUndo();delItem(sel.kind,sel.id);sel=null;changed()}break;
    case'dup':if(sel){const it=findItem(sel.kind,sel.id);if(!it)break;pushUndo();let n;
      if(sel.kind==='obj'){n=addObj(it.f,it.type,it.x+.5,it.y+.5,{rot:it.rot,c:it.c,lift:it.lift})}
      else if(sel.kind==='zone'){n=addZone(it.f,it.type,it.x+.5,it.y+.5,it.w,it.d,{name:it.name,mat:it.mat,roof:it.roof})}
      else if(sel.kind==='wall'){n=addWall(it.f,it.x1+.5,it.y1+.5,it.x2+.5,it.y2+.5,it)}
      if(n)sel={kind:sel.kind,id:n.id};changed()}break;
    case'rot':mutSel(it=>{it.rot=((it.rot+(+d.v))%360+360)%360});break;
    case'swap':mutSel(it=>{const D=OBJ[d.v];if(!D)return;it.type=d.v;it.c=D.c;it.lift=D.lift||0});toast('Diganti menjadi '+OBJ[d.v].name+'.');break;
    case'color':mutSel(it=>{it.c=d.v});break;
    case'wmat':mutSel(it=>{it.mat=d.v});break;
    case'wmatall':{const it=findItem('wall',sel.id);if(!it)break;pushUndo();P.walls.forEach(w=>{if(w.f===it.f&&w.style==='tembok')w.mat=it.mat});changed();toast('Material diterapkan ke semua dinding lantai ini.');break}
    case'wstyle':mutSel(it=>{it.style=d.v;if(FENCES[d.v]){const F=FENCES[d.v];it.h=F.h;it.mat=F.mat;it.t=F.t}else if(d.v==='railing'){it.h=1.0;it.mat='hitam';it.t=.08}else{it.h=3.0;it.t=.15;if(it.mat==='hitam')it.mat='krem'}
      P.ops=P.ops.filter(o=>o.wid!==it.id||(d.v==='tembok'?o.type!=='gerbang':o.type==='gerbang'))});break;
    case'zmat':mutSel(it=>{it.mat=d.v});break;
    case'ztype':mutSel(it=>{it.type=d.v;it.mat=ZTYPES[d.v].mat;it.roof=ZTYPES[d.v].roof;if(/^(Ruang|Teras|Carport|Balkon|Taman|Kolam|Lantai)/.test(it.name))it.name=ZTYPES[d.v].n});break;
    case'flip':mutSel(it=>{it.flip=it.flip?0:1});break;
    case'addwalls':{const z=findItem('zone',sel.id);if(!z)break;pushUndo();wallsAround(z.f,z.x,z.y,z.w,z.d,'krem');changed();toast('Dinding keliling ditambahkan.');break}
  }
}
function fieldChange(t){
  const f=t.dataset.f;const v=t.type==='checkbox'?t.checked:t.type==='number'?parseFloat(t.value):t.value;
  if(t.type==='number'&&!isFinite(v))return;
  if(f.startsWith('o.')){opts[f.slice(2)]=t.type==='number'?clamp(v,+t.min,+t.max):v;renderPanel();return}
  if(f.startsWith('lot.')){pushUndo();P.lot[f.slice(4)]=clamp(v,+t.min,+t.max);changed();fit2D();camPreset('iso');return}
  if(f.startsWith('floor.')){pushUndo();P.floors[+f.slice(6)].name=String(v).slice(0,20)||'Lantai';changed({quiet:true});return}
  if(f.startsWith('sel.')&&sel){const k=f.slice(4);mutSel(it=>{
    if(k==='s'){const w=wallById(it.wid);it.s=clamp(v,it.w/2+.05,wlen(w)-it.w/2-.05)}
    else if(k==='w'&&sel.kind==='op'){const w=wallById(it.wid);it.w=clamp(v,.4,Math.max(.5,wlen(w)-.2))}
    else if(typeof v==='number'){it[k]=clamp(v,+t.min,+t.max)}else it[k]=v})}
}

/* ---------- modal ---------- */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
const mhead=t=>`<header><span>${t}</span><button class="ib" data-act="closem" aria-label="Tutup">${ic('close')}</button></header>`;
function openMenu(){
  const list=idx();
  openModal(`${mhead('Proyek tersimpan')}<div class="bd">
    <div class="row"><button class="btn" data-act="newproj">${ic('plus','width:16px;height:16px')}Proyek baru</button><button class="btn" data-act="tplm" data-v="tingkat">Contoh tingkat</button><button class="btn" data-act="tplm" data-v="villa">Contoh villa</button><button class="btn" data-act="exportm">Salin kode</button><button class="btn" data-act="importm">Tempel kode</button></div>${tplGallery()}
    ${LS.ok?'':'<p class="sub">Penyimpanan peramban dimatikan. Gunakan Salin kode untuk membawa rancanganmu.</p>'}
    <div style="margin-top:8px">${list.length?list.map(p=>`<div class="proj"><div class="nm"><b>${esc(p.name)}</b><small>${p.floors} lantai, ${new Date(p.t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</small></div><button class="btn sm" data-act="openproj" data-v="${p.id}">Buka</button><button class="ib" data-act="delproj" data-v="${p.id}" aria-label="Hapus">${ic('trash')}</button></div>`).join(''):'<p class="sub">Belum ada proyek yang disimpan. Tekan Simpan untuk menyimpan rancanganmu.</p>'}</div>
    ${CREDIT}</div>`);
}
function openExport(){openModal(`${mhead('Salin kode proyek')}<div class="bd"><p class="sub">Salin teks ini dan simpan di catatan. Tempel kembali lewat menu untuk memuat rancangan di perangkat lain.</p><textarea id="expTa" readonly>${esc(JSON.stringify(P))}</textarea><div class="row" style="margin-top:8px"><button class="btn pri" data-act="copyexp">Salin</button></div></div>`);setTimeout(()=>{const t=$('#expTa');if(t){t.focus();t.select()}},50)}
function openImport(){openModal(`${mhead('Tempel kode proyek')}<div class="bd"><textarea id="impTa" placeholder="Tempel kode di sini"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" data-act="doimp">Muat</button></div></div>`)}
function openPhoto(){
  if(!renderer)return;try{updCam();renderer.render(scene,camera);const u=el3d().toDataURL('image/png');openModal(`${mhead('Foto rumah')}<div class="bd"><img class="photo" alt="Foto 3D rumah" src="${u}"><p class="sub">Tekan lama gambar di ponsel lalu pilih Simpan ke Foto. Di laptop klik kanan lalu simpan gambar.</p></div>`)}catch(e){toast('Foto gagal dibuat.')}
}
function modalAct(a,v){
  if(a==='closem')closeModal();
  else if(a==='newproj'){pushUndo();const lot=P.lot;P=newProject('Rumah baru');P.lot=lot;activeFloor=0;closeModal();afterRestore();fit2D();toast('Proyek baru siap.')}
  else if(a==='tplm'){closeModal();actions('template',{v})}
  else if(a==='exportm')openExport();
  else if(a==='importm')openImport();
  else if(a==='openproj'){if(loadProjectById(v)){hist.u=[];hist.r=[];activeFloor=0;closeModal();afterRestore();fit2D();camPreset('iso');toast('Proyek dibuka.')}}
  else if(a==='delproj'){deleteProjectById(v);openMenu()}
  else if(a==='copyexp'){const t=$('#expTa');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Kode disalin.'),()=>toast(ok?'Kode disalin.':'Tahan teks lalu pilih Salin.'));else toast(ok?'Kode disalin.':'Tahan teks lalu pilih Salin.')}
  else if(a==='doimp'){try{const o=JSON.parse($('#impTa').value);if(!o||!Array.isArray(o.walls)||!Array.isArray(o.zones)||!Array.isArray(o.floors))throw 0;
      o.objs=(o.objs||[]).filter(x=>OBJ[x.type]);o.ops=o.ops||[];pushUndo();P=o;activeFloor=0;closeModal();afterRestore();fit2D();camPreset('iso');toast('Proyek dimuat.')}catch(e){toast('Kode tidak valid.')}}
}

/* ---------- boot ---------- */
function boot(){
  renderRail();attach2D();
  try{init3D()}catch(e){console.error(e);$('#nogl').style.display='grid'}
  let auto=LS.get(KEY_AUTO);let ok=false;
  if(auto){try{const o=JSON.parse(auto);if(o&&o.walls&&o.zones&&o.floors){P=o;ok=true}}catch(e){}}
  if(!ok)loadTemplate();
  // ukuran
  let fitted=false;
  new ResizeObserver(()=>{resize2D();if(!fitted&&c2().clientWidth){fit2D();fitted=true}inv2()}).observe($('#pane2d'));
  const wide=window.innerWidth>=900;setView(wide?'split':'2d');
  afterRestore();camPreset('iso',true);requestAnimationFrame(loop2D);
  // peristiwa umum
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
  document.addEventListener('click',e=>{
    const fl=e.target.closest('[data-floor]');if(fl){activeFloor=+fl.dataset.floor;sel=null;renderFloorBar();renderPanel();inv2();dirty3D=true;updSelHelper();return}
    const a=e.target.closest('[data-act]');if(!a)return;const inModal=!!a.closest('#modal');
    if(inModal||['closem'].includes(a.dataset.act)){modalAct(a.dataset.act,a.dataset.v);return}
    actions(a.dataset.act,a.dataset);
  });
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  $('#panelBody').addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.f)fieldChange(e.target)});
  $('#panelHandle').addEventListener('click',()=>{if(window.innerWidth<900)$('#panel').classList.toggle('col')});
  $$('#viewSeg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
  $('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
  $('#btnSave').addEventListener('click',()=>{const ok=saveProject();renderPanel();toast(ok?'Tersimpan: '+P.name:'Peramban menolak penyimpanan. Pakai Salin kode di menu.')});
  $('#btnMenu').addEventListener('click',openMenu);
  $('#projName').addEventListener('change',e=>{P.name=e.target.value.trim()||'Rumah baru';e.target.value=P.name;scheduleAuto()});
  $('#zIn').addEventListener('click',()=>{V2.s=clamp(V2.s*1.25,5,140);inv2()});$('#zOut').addEventListener('click',()=>{V2.s=clamp(V2.s/1.25,5,140);inv2()});$('#zFit').addEventListener('click',fit2D);
  $('#t3Roof').addEventListener('click',e=>{V3.roof=!V3.roof;e.currentTarget.setAttribute('aria-pressed',V3.roof);dirty3D=true});
  $('#t3Night').addEventListener('click',e=>{V3.night=!V3.night;e.currentTarget.setAttribute('aria-pressed',V3.night);dirty3D=true});
  $('#t3Cut').addEventListener('click',e=>{V3.cut=!V3.cut;e.currentTarget.setAttribute('aria-pressed',V3.cut);renderFloorBar();dirty3D=true});
  $('#v3Front').addEventListener('click',()=>camPreset('front'));$('#v3Iso').addEventListener('click',()=>camPreset('iso'));$('#v3Top').addEventListener('click',()=>camPreset('top'));
  $('#v3Near').addEventListener('click',()=>camPreset('near'));$('#v3Far').addEventListener('click',()=>camPreset('far'));$('#v3Eye').addEventListener('click',()=>{if(W.on){camPreset('near')}else walkStart()});bindWalk();
  $('#z3In').addEventListener('click',()=>zoom3(0.6));$('#z3Out').addEventListener('click',()=>zoom3(1.6));
  $('#t3Photo').addEventListener('click',openPhoto);
  window.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
    if(e.code==='Space'){spaceDown=true;e.preventDefault()}
    if((e.key==='Delete'||e.key==='Backspace')&&sel){actions('del',{});e.preventDefault()}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.shiftKey?redo():undo();e.preventDefault()}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){redo();e.preventDefault()}
    else if(e.key==='Escape'){closeModal();setTool('select')}
    else if(e.key.toLowerCase()==='r'&&sel&&sel.kind==='obj'){actions('rot',{v:90})}
  });
  window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
  window.addEventListener('resize',()=>{if(window.innerWidth<900&&view==='split')setView('2d');inv2();need3D=true});
  window.addEventListener('beforeunload',()=>{try{LS.set(KEY_AUTO,JSON.stringify(P))}catch(e){}});
  const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>inv2());
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(inv2);
}
boot();
</script>
